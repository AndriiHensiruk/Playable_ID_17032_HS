<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sliding Door Playable</title>
<link rel="preload" href="assets/bg.png" as="image">
<link rel="preload" href="assets/girl_1.png" as="image">
<link rel="preload" href="assets/door.png" as="image">
<link rel="preload" href="assets/door_outline.png" as="image">
<style>
:root{--bg:#000;--ease:cubic-bezier(.22,.8,.25,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:center}
#game{position:relative;width:100vw;height:100vh;height:100dvh;max-width:calc(100vh*9/16);max-width:calc(100dvh*9/16);max-height:calc(100vw*16/9);aspect-ratio:9/16;overflow:hidden;background:var(--bg);touch-action:none;isolation:isolate;opacity:0;transition:opacity .3s}
#game.ready{opacity:1}
#game.shake{animation:screenShake .45s ease-in-out}
@keyframes screenShake{0%,100%{transform:translate3d(0,0,0)}12%{transform:translate3d(-6px,3px,0)}28%{transform:translate3d(7px,-4px,0)}42%{transform:translate3d(-5px,4px,0)}58%{transform:translate3d(6px,-2px,0)}74%{transform:translate3d(-7px,3px,0)}88%{transform:translate3d(4px,-3px,0)}}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
#background{z-index:1}
#girl{z-index:5;transition:opacity .28s ease,transform .42s var(--ease)}
#door,#doorOutline{position:absolute;top:0;left:auto;width:100%;height:100%;object-fit:contain;transform-origin:right center;transform:translate3d(0,0,0);pointer-events:none;-webkit-user-drag:none;will-change:transform}
#door{z-index:20;right:-10%;transition:opacity .4s ease}
#doorOutline{z-index:19;right:-8%;transition:opacity .2s ease;animation:doorGlow 1.2s ease-in-out infinite}
#game.settle #door,#game.settle #doorOutline{transition:transform .28s cubic-bezier(.25,.8,.25,1),opacity .2s}
@keyframes doorGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,255,255,.5)) drop-shadow(0 0 8px rgba(255,210,70,.4))}50%{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 24px rgba(255,210,70,1))}}
#tutorialText,#gameText,#finalText{position:absolute;left:50%;transform:translateX(-50%);object-fit:contain;pointer-events:none;width:86%}
#tutorialText{z-index:50;top:64%;transition:opacity .25s}
#gameText{z-index:50;top:54%;opacity:0;transition:opacity .35s}
#finalText{z-index:70;top:24%;opacity:0;transition:opacity .4s}
#hand{position:absolute;z-index:60;left:62%;top:42%;width:23%;object-fit:contain;pointer-events:none;transform:rotate(-8deg);animation:handHint 1.35s ease-in-out infinite;transition:opacity .22s,left .35s,top .35s}
@keyframes handHint{50%{transform:translate3d(-25px,0,0) rotate(-8deg)}}
#bulb{position:absolute;z-index:80;left:7%;top:5%;width:16%;object-fit:contain;opacity:0;transform:scale(.9);pointer-events:none;transition:opacity .35s,transform .35s,filter .2s}
#bulb.visible{opacity:1;transform:scale(1);pointer-events:auto}
#bulb.blink{animation:bulbBlink .65s ease-in-out infinite}
#bulb.hit{transform:scale(1.12);filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 28px rgba(255,213,92,.95))}
@keyframes bulbBlink{0%,100%{transform:scale(1)}50%{transform:scale(1.12);filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 25px #ffd83d)}}
#cta{position:absolute;z-index:100;left:50%;bottom:7%;width:65%;transform:translateX(-50%) scale(.9);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
#cta.visible{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1);animation:ctaPulse 1.4s ease-in-out infinite}
@keyframes ctaPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}50%{filter:drop-shadow(0 0 14px rgba(255,255,255,.9))}}
#soundButton{position:absolute;z-index:150;top:4%;right:4%;width:11%;aspect-ratio:1;border:none;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.85}
#soundButton:active{transform:scale(.94)}
#vfxLayer{position:absolute;inset:0;z-index:140;pointer-events:none;overflow:hidden}
.fx-flash,.tap-ring,.spark{position:absolute;border-radius:999px;pointer-events:none}
.fx-flash{inset:0;background:radial-gradient(circle at center,rgba(255,255,255,.28),rgba(255,255,255,0) 62%);opacity:0;animation:flashBurst .45s ease forwards}
@keyframes flashBurst{30%{opacity:1}100%{opacity:0}}
.tap-ring{width:24px;height:24px;border:2px solid rgba(255,255,255,.8);box-shadow:0 0 14px rgba(255,210,77,.8);transform:translate(-50%,-50%) scale(.4);animation:tapRing .55s ease forwards}
@keyframes tapRing{0%{opacity:0}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(3.4)}}
.spark{width:8px;height:8px;background:#fff;box-shadow:0 0 12px rgba(255,210,77,.9);transform:translate(-50%,-50%);animation:particleFly .8s ease-out forwards}
@keyframes particleFly{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.4)}}
#fade{position:absolute;z-index:200;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.active{opacity:1}
</style>
</head>
<body>
<div id="game">
    <img id="background" class="layer" src="assets/bg.png" draggable="false" decoding="async">
    <img id="girl" class="layer" src="assets/girl_1.png" draggable="false" decoding="async">
    <img id="doorOutline" src="assets/door_outline.png" draggable="false" decoding="async">
    <img id="door" src="assets/door.png" draggable="false" decoding="async">
    <img id="tutorialText" src="assets/tutorial_text.png" draggable="false" decoding="async">
    <img id="gameText" src="assets/text_35.png" draggable="false" decoding="async">
    <img id="hand" src="assets/hand.png" draggable="false" decoding="async">
    <img id="bulb" src="assets/bulb.png" draggable="false" decoding="async">
    <img id="finalText" src="assets/final_text.png" draggable="false" decoding="async">
    <img id="cta" src="assets/cta_button.png" draggable="false" decoding="async">
    <div id="vfxLayer"></div>
    <button id="soundButton" type="button" aria-label="Toggle sound">🔊</button>
    <div id="fade"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const game = $("game"), girl = $("girl"), door = $("door"), doorOutline = $("doorOutline");
const background = $("background"), tutorialText = $("tutorialText"), gameText = $("gameText");
const hand = $("hand"), bulb = $("bulb"), finalText = $("finalText"), cta = $("cta");
const fade = $("fade"), soundButton = $("soundButton"), vfxLayer = $("vfxLayer");

const CTA_URL = "https://example.com";
const SETTINGS = { releaseBack: 5, voiceDelay: 180, idleHintMs: 2500, thresholds: [20, 40, 80, 100] };
const IMAGES = ["bg","girl_1","girl_2","girl_3","girl_4","girl_final","door","door_outline","bulb","hand","final_bg","tutorial_text","text_35","text_50","text_90","final_text","cta_button"].map(n => `assets/${n}.png`);
const SOUNDS = { music: "assets/music.mp3", door: "assets/door_open.mp3", v35: "assets/text_35.mp3", v50: "assets/text_50.mp3", v90: "assets/text_90.mp3", vfinal: "assets/final_text.mp3" };

let doorProgress = 0, dragging = false, startX = 0, startProgress = 0;
let currentScene = 1, finalSceneShown = false, voiceLocked = false, interactionLocked = false;
let audioEnabled = true, timers = [], idleTimer = null;

const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
function later(fn, ms) { const id = setTimeout(fn, ms); timers.push(id); return id; }

const Audio_ = (() => {
    let ctx = null, master, musicGain, buffers = {}, musicStarted = false, doorNode = null, voiceNode = null;
    const AC = window.AudioContext || window.webkitAudioContext;

    function ensure() {
        if (ctx || !AC) return ctx;
        ctx = new AC();
        master = ctx.createGain(); master.connect(ctx.destination);
        musicGain = ctx.createGain(); musicGain.gain.value = 0.35; musicGain.connect(master);
        return ctx;
    }
    function decode(arr) {
        return new Promise((res, rej) => { const p = ctx.decodeAudioData(arr, res, rej); if (p && p.catch) p.catch(rej); });
    }
    async function load() {
        if (!ensure()) return;
        await Promise.all(Object.entries(SOUNDS).map(async ([k, src]) => {
            try { const r = await fetch(src); buffers[k] = await decode(await r.arrayBuffer()); } catch (e) {}
        }));
    }
    // ВИКЛИКАТИ синхронно всередині user gesture
    function unlock() {
        if (!ensure()) return;
        if (ctx.state !== "running") ctx.resume().catch(() => {});
        try { const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0); } catch (e) {}
    }
    function startMusic() {
        if (musicStarted || !ctx || !buffers.music) return;
        musicStarted = true;
        const s = ctx.createBufferSource(); s.buffer = buffers.music; s.loop = true; s.connect(musicGain); s.start(0);
    }
    function playDoor() {
        stopDoor();
        if (!ctx || !buffers.door) return;
        const g = ctx.createGain(); g.gain.value = 0.7; g.connect(master);
        const s = ctx.createBufferSource(); s.buffer = buffers.door; s.connect(g); s.start(0);
        doorNode = { s, g };
    }
    function stopDoor() {
        if (!doorNode) return;
        const { s, g } = doorNode; doorNode = null;
        try { g.gain.setTargetAtTime(0, ctx.currentTime, 0.03); s.stop(ctx.currentTime + 0.15); } catch (e) {}
    }
    // повертає тривалість (сек) — завершення рахуємо таймером, тому працює й без звуку
    function playVoice(key) {
        stopDoor(); stopVoice();
        const buf = buffers[key];
        if (!ctx || !buf) return 1.8;
        musicGain.gain.setTargetAtTime(0.12, ctx.currentTime, 0.05);
        const s = ctx.createBufferSource(); s.buffer = buf; s.connect(master); s.start(0);
        voiceNode = s;
        return buf.duration;
    }
    function stopVoice() {
        if (voiceNode) { try { voiceNode.stop(); } catch (e) {} voiceNode = null; }
    }
    function restoreMusic() { if (ctx) musicGain.gain.setTargetAtTime(0.35, ctx.currentTime, 0.15); }
    function setEnabled(on) { if (ctx) master.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, 0.02); }
    function suspend() { if (ctx && ctx.state === "running") ctx.suspend().catch(() => {}); }
    function resume() { if (ctx && audioEnabled && ctx.state !== "running") ctx.resume().catch(() => {}); }
    function tone(o = {}) {
        if (!ctx || !audioEnabled) return;
        const { frequency = 440, duration = 0.12, volume = 0.04, type = "sine", slide = 0 } = o;
        const t = ctx.currentTime, osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(frequency, t);
        if (slide) osc.frequency.linearRampToValueAtTime(frequency + slide, t + duration);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(volume, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + duration + 0.03);
    }
    return { load, unlock, startMusic, playDoor, stopDoor, playVoice, stopVoice, restoreMusic, setEnabled, suspend, resume, tone };
})();

/* ---------- VFX ---------- */
function triggerScreenShake() {
    game.classList.remove("shake"); void game.offsetWidth; game.classList.add("shake");
    later(() => game.classList.remove("shake"), 500);
}
function triggerFlash() {
    const f = document.createElement("div"); f.className = "fx-flash"; vfxLayer.appendChild(f);
    later(() => f.remove(), 500);
}
function triggerTapEffect(x, y) {
    const r = game.getBoundingClientRect(), px = x - r.left, py = y - r.top;
    const ring = document.createElement("div"); ring.className = "tap-ring";
    ring.style.left = px + "px"; ring.style.top = py + "px"; vfxLayer.appendChild(ring);
    later(() => ring.remove(), 550);
    for (let i = 0; i < 8; i++) {
        const s = document.createElement("div"); s.className = "spark";
        s.style.left = px + "px"; s.style.top = py + "px";
        s.style.setProperty("--dx", (Math.random() - 0.5) * 100 + "px");
        s.style.setProperty("--dy", (Math.random() - 0.5) * 100 + "px");
        vfxLayer.appendChild(s); later(() => s.remove(), 800);
    }
}

/* ---------- GAME ---------- */
function init() {
    timers.forEach(clearTimeout); timers = [];
    doorProgress = 0; currentScene = 1; finalSceneShown = false;
    voiceLocked = false; interactionLocked = false; dragging = false;
    updateDoor();
    door.style.opacity = doorOutline.style.opacity = "1";
    door.style.display = doorOutline.style.display = hand.style.display = "block";
    tutorialText.style.opacity = hand.style.opacity = "1";
    hand.style.left = "62%"; hand.style.top = "42%";
    gameText.style.opacity = finalText.style.opacity = "0";
    bulb.classList.remove("visible", "blink", "hit");
    cta.classList.remove("visible");
    background.src = "assets/bg.png";
}

function updateDoor() {
    const t = `translate3d(${(doorProgress / 100) * game.clientWidth}px,0,0)`;
    door.style.transform = doorOutline.style.transform = t;
}

function setDoorProgress(v) {
    const cap = SETTINGS.thresholds[currentScene - 1] ?? 100;
    doorProgress = clamp(v, 0, cap);
    updateDoor();
    if (doorProgress >= cap) advanceScene();
}

function advanceScene() {
    if (currentScene === 1) scene35();
    else if (currentScene === 2) scene50();
    else if (currentScene === 3) scene90();
}

function changeGirl(src) {
    girl.style.opacity = "0"; girl.style.transform = "scale(1.04)";
    later(() => { girl.src = src; girl.style.opacity = "1"; girl.style.transform = "scale(1)"; }, 180);
}

function playVoice(key, { onDone } = {}) {
    voiceLocked = true; dragging = false;
    clearTimeout(idleTimer);
    Audio_.stopDoor();
    later(() => {
        const dur = Audio_.playVoice(key);
        later(() => {
            voiceLocked = false;
            Audio_.restoreMusic();
            gameText.style.opacity = "0";
            if (!finalSceneShown) { doorOutline.style.opacity = "1"; hand.style.opacity = "1"; }
            if (onDone) onDone();
            armIdle();
        }, dur * 1000 + 100);
    }, SETTINGS.voiceDelay);
}

function armIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
        if (!dragging && !voiceLocked && !finalSceneShown) {
            hand.style.opacity = "1";
            if (currentScene < 4) doorOutline.style.opacity = "1";
        }
    }, SETTINGS.idleHintMs);
}

function showText(src) { gameText.src = src; gameText.style.opacity = "1"; }

function scene35() {
    currentScene = 2;
    changeGirl("assets/girl_2.png"); showText("assets/text_35.png");
    playVoice("v35");
    bulb.classList.add("visible");
    triggerFlash(); Audio_.tone({ frequency: 520, duration: .16, volume: .03, type: "triangle", slide: 90 });
}
function scene50() {
    currentScene = 3;
    changeGirl("assets/girl_3.png"); showText("assets/text_50.png");
    playVoice("v50");
    triggerScreenShake(); Audio_.tone({ frequency: 660, duration: .14, volume: .04, type: "sawtooth", slide: 120 });
}
function scene90() {
    currentScene = 4;
    changeGirl("assets/girl_4.png"); showText("assets/text_90.png");
    door.style.opacity = doorOutline.style.opacity = "0";
    later(() => { door.style.display = doorOutline.style.display = "none"; }, 450);
    bulb.classList.add("visible", "blink");
    hand.style.left = "17%"; hand.style.top = "15%";
    playVoice("v90");
    triggerFlash(); Audio_.tone({ frequency: 780, duration: .18, volume: .05, type: "square", slide: 150 });
}

function releaseDoor() {
    if (!dragging) return;
    dragging = false;
    Audio_.stopDoor();
    game.classList.add("settle");
    setDoorProgress(Math.max(0, doorProgress - SETTINGS.releaseBack));
    later(() => game.classList.remove("settle"), 320);
    if (!finalSceneShown && !voiceLocked && currentScene < 4) doorOutline.style.opacity = "1";
    armIdle();
}

function showFinalScene() {
    if (finalSceneShown || interactionLocked) return;
    interactionLocked = finalSceneShown = true;
    currentScene = 5; dragging = false;
    clearTimeout(idleTimer);
    hand.style.display = "none";
    fade.classList.add("active");
    bulb.classList.remove("blink", "visible");
    triggerFlash(); triggerScreenShake();
    Audio_.tone({ frequency: 960, duration: .25, volume: .06, type: "triangle", slide: 200 });
    Audio_.playVoice("vfinal");

    later(() => {
        background.src = "assets/final_bg.png";
        girl.src = "assets/girl_final.png"; girl.style.opacity = "0";
        gameText.style.opacity = tutorialText.style.opacity = "0";
        door.style.display = doorOutline.style.display = "none";
        finalText.style.opacity = "1";
        later(() => { girl.style.opacity = "1"; cta.classList.add("visible"); interactionLocked = false; }, 150);
        later(() => fade.classList.remove("active"), 250);
    }, 350);
}

function openStore() {
    try { if (window.mraid && typeof mraid.open === "function") { mraid.open(CTA_URL); return; } } catch (e) {}
    window.open(CTA_URL, "_blank");
}

/* ---------- INPUT ---------- */
game.addEventListener("pointerdown", (e) => {
    Audio_.unlock();                  // синхронно в жесті — критично для iOS
    Audio_.startMusic();
    if (e.target === bulb || e.target === cta || e.target === soundButton) return;
    if (voiceLocked || interactionLocked || finalSceneShown) return;

    dragging = true; startX = e.clientX; startProgress = doorProgress;
    clearTimeout(idleTimer);
    tutorialText.style.opacity = hand.style.opacity = doorOutline.style.opacity = "0";
    triggerTapEffect(e.clientX, e.clientY);
    Audio_.playDoor();
    try { game.setPointerCapture(e.pointerId); } catch (err) {}
});

game.addEventListener("pointermove", (e) => {
    if (!dragging || voiceLocked || interactionLocked) return;
    const delta = e.clientX - startX;
    if (delta <= 0) return;
    setDoorProgress(startProgress + (delta / game.clientWidth) * 100);
});
game.addEventListener("pointerup", releaseDoor);
game.addEventListener("pointercancel", releaseDoor);

bulb.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    Audio_.unlock();
    if (currentScene < 4 || finalSceneShown || voiceLocked || interactionLocked) return;
    bulb.classList.add("hit");
    triggerTapEffect(e.clientX, e.clientY); triggerFlash();
    later(() => bulb.classList.remove("hit"), 220);
    showFinalScene();
});

cta.addEventListener("pointerdown", (e) => e.stopPropagation());
cta.addEventListener("click", (e) => {
    e.stopPropagation();
    triggerTapEffect(e.clientX, e.clientY);
    Audio_.tone({ frequency: 880, duration: .12, volume: .04, type: "triangle", slide: 120 });
    openStore();
});

soundButton.addEventListener("pointerdown", (e) => { e.stopPropagation(); Audio_.unlock(); });
soundButton.addEventListener("click", (e) => {
    e.stopPropagation();
    audioEnabled = !audioEnabled;
    soundButton.textContent = audioEnabled ? "🔊" : "🔇";
    Audio_.setEnabled(audioEnabled);
    if (audioEnabled) Audio_.resume();
});

game.addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("resize", updateDoor);
window.addEventListener("orientationchange", () => setTimeout(updateDoor, 200));
document.addEventListener("visibilitychange", () => document.hidden ? Audio_.suspend() : Audio_.resume());
window.addEventListener("pagehide", Audio_.suspend);

function loadImages() {
    return Promise.all(IMAGES.map((src) => new Promise((res) => {
        const img = new Image(); img.src = src;
        (img.decode ? img.decode() : Promise.reject()).then(res, () => { img.onload = img.onerror = res; if (img.complete) res(); });
    })));
}
init();
Promise.race([Promise.all([loadImages(), Audio_.load()]), new Promise((r) => setTimeout(r, 4000))])
    .then(() => { game.classList.add("ready"); armIdle(); });
</script>
</body>
</html>
