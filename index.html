<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sliding Door Playable</title>
<link rel="preload" href="assets/bg.png" as="image">
<link rel="preload" href="assets/girl_1.png" as="image">
<link rel="preload" href="assets/door.png" as="image">
<link rel="preload" href="assets/door_outline.png" as="image">
<style>
:root{--bg:#000;--ease:cubic-bezier(.22,.8,.25,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:center}
#game{position:relative;width:100vw;height:100vh;height:100dvh;max-width:calc(100vh*9/16);max-width:calc(100dvh*9/16);max-height:calc(100vw*16/9);aspect-ratio:9/16;overflow:hidden;background:var(--bg);touch-action:none;isolation:isolate;opacity:0;transition:opacity .3s,filter .6s ease}
#game.ready{opacity:1}
#game.blurred{filter:blur(14px) saturate(.7) brightness(.7)}
#game.shake{animation:screenShake .45s ease-in-out}
@keyframes screenShake{0%,100%{transform:translate3d(0,0,0)}12%{transform:translate3d(-6px,3px,0)}28%{transform:translate3d(7px,-4px,0)}42%{transform:translate3d(-5px,4px,0)}58%{transform:translate3d(6px,-2px,0)}74%{transform:translate3d(-7px,3px,0)}88%{transform:translate3d(4px,-3px,0)}}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
#background{z-index:1;transform:scale(1.04);transition:transform .25s ease-out}
/* atmosphere */
#atmo{position:absolute;inset:-10%;z-index:3;pointer-events:none;mix-blend-mode:screen;opacity:.45;background:radial-gradient(40% 30% at 25% 20%,rgba(255,210,120,.35),transparent 70%),radial-gradient(45% 35% at 80% 70%,rgba(140,170,255,.25),transparent 70%);animation:atmoDrift 14s ease-in-out infinite alternate}
@keyframes atmoDrift{to{transform:translate3d(4%,3%,0) scale(1.08)}}
#vignette{position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38) 100%)}
/* character: parallax > breathing > image */
#girlParallax,#girlWrap{position:absolute;inset:0;z-index:5;pointer-events:none}
#girlParallax{transition:transform .25s ease-out}
#girlWrap{transform-origin:50% 100%;animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.008) translateY(-.15%)}}
#girl{transition:opacity .28s,transform .42s var(--ease),filter .3s}
/* door */
#door,#doorOutline,#doorTrail{position:absolute;top:0;left:auto;width:100%;height:100%;object-fit:contain;transform-origin:right center;transform:translate3d(0,0,0);pointer-events:none;-webkit-user-drag:none;will-change:transform}
#door{z-index:20;right:-10%;transition:transform .06s linear,opacity .4s}
#doorOutline{z-index:19;right:-8%;transition:transform .06s linear,opacity .2s;animation:doorGlow 1.2s ease-in-out infinite}
#doorTrail{z-index:18;right:-8%;opacity:0;filter:blur(4px) drop-shadow(0 0 16px rgba(255,210,70,.9));transition:transform .32s ease-out,opacity .2s}
#doorOutline.moving{animation:none;filter:drop-shadow(0 0 calc(6px + 14px*var(--g,0)) rgba(255,255,255,.9)) drop-shadow(0 0 calc(12px + 30px*var(--g,0)) rgba(255,210,70,1))}
#game.settle #door,#game.settle #doorOutline{transition:transform .28s cubic-bezier(.25,.8,.25,1),opacity .2s}
@keyframes doorGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,255,255,.5)) drop-shadow(0 0 8px rgba(255,210,70,.4))}50%{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 24px rgba(255,210,70,1))}}
#burst{position:absolute;inset:-20%;z-index:25;pointer-events:none;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle at 60% 50%,rgba(255,240,190,.95) 0,rgba(255,200,90,.45) 22%,transparent 55%),repeating-conic-gradient(from 0deg at 60% 50%,rgba(255,235,170,.35) 0 6deg,transparent 6deg 18deg)}
#burst.go{animation:burstAnim 1s ease-out}
@keyframes burstAnim{0%{opacity:0;transform:scale(.5)}25%{opacity:1}100%{opacity:0;transform:scale(1.6) rotate(12deg)}}
/* cinematic texts */
.txt{position:absolute;left:50%;width:86%;object-fit:contain;pointer-events:none;opacity:0;filter:blur(10px);transform:translateX(-50%) scale(.9);transition:opacity .45s,filter .45s,transform .6s var(--ease)}
.txt.show{opacity:1;filter:blur(0);transform:translateX(-50%) scale(1)}
.txt.gone{opacity:0;filter:blur(8px);transform:translateX(-50%) scale(1.06)}
#tutorialText{z-index:50;top:64%}
#gameText{z-index:50;top:54%}
#finalText{z-index:70;top:24%}
#hand{position:absolute;z-index:60;left:62%;top:42%;width:23%;object-fit:contain;pointer-events:none;transform:rotate(-8deg);animation:handHint 1.35s ease-in-out infinite;transition:opacity .22s,left .35s,top .35s}
@keyframes handHint{50%{transform:translate3d(-25px,0,0) rotate(-8deg)}}
/* bulb */
#bulb{position:absolute;z-index:80;left:7%;top:5%;width:16%;object-fit:contain;opacity:0;transform:scale(.9);pointer-events:none;transition:opacity .35s,transform .35s,filter .2s}
#bulb.visible{opacity:1;transform:scale(1);pointer-events:auto}
#bulb.blink{animation:bulbBlink .65s ease-in-out infinite}
#bulb.hit{transform:scale(1.15);filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 28px rgba(255,213,92,.95))}
@keyframes bulbBlink{0%,100%{transform:scale(1)}50%{transform:scale(1.12);filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 25px #ffd83d)}}
#bulbHalo{position:absolute;z-index:79;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);opacity:0;pointer-events:none;transition:opacity .4s}
#bulbHalo.on{opacity:1}
#bulbHalo i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,220,120,.85);animation:halo 1.6s ease-out infinite}
#bulbHalo i:nth-child(2){animation-delay:.8s}
#bulbHalo b{position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,rgba(255,230,140,.6),transparent 70%);animation:haloGlow 1.2s ease-in-out infinite}
@keyframes halo{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes haloGlow{50%{transform:scale(1.3);opacity:.6}}
/* CTA with light sweep */
#cta{position:absolute;z-index:100;left:50%;bottom:7%;width:65%;transform:translateX(-50%) scale(.9);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
#cta img{display:block;width:100%;pointer-events:none;-webkit-user-drag:none}
#cta::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.9) 50%,transparent 62%);background-size:260% 100%;background-position:160% 0;-webkit-mask:url(assets/cta_button.png) center/100% 100% no-repeat;mask:url(assets/cta_button.png) center/100% 100% no-repeat}
#cta.visible{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1);animation:ctaPulse 1.4s ease-in-out infinite}
#cta.visible::after{animation:ctaSweep 2.4s ease-in-out infinite}
#cta:active{transform:translateX(-50%) scale(.97)}
@keyframes ctaPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}50%{filter:drop-shadow(0 0 14px rgba(255,255,255,.9))}}
@keyframes ctaSweep{0%{background-position:160% 0}55%,100%{background-position:-60% 0}}
#soundButton{position:absolute;z-index:150;top:4%;right:4%;width:11%;aspect-ratio:1;border:none;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.85}
#soundButton:active{transform:scale(.94)}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:140;pointer-events:none}
.fx-flash{position:absolute;inset:0;z-index:141;pointer-events:none;border-radius:0;background:radial-gradient(circle at center,rgba(255,255,255,.28),rgba(255,255,255,0) 62%);opacity:0;animation:flashBurst .45s ease forwards}
@keyframes flashBurst{30%{opacity:1}100%{opacity:0}}
#fade{position:absolute;z-index:200;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
#fade.active{opacity:1}
#whiteFlash{position:absolute;z-index:210;inset:0;background:#fff;opacity:0;pointer-events:none}
#whiteFlash.go{animation:wf .7s ease-out}
@keyframes wf{0%{opacity:.95}100%{opacity:0}}
#startScreen{position:fixed;inset:0;z-index:220;display:flex;align-items:center;justify-content:center;background:rgba(5,7,15,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:opacity .5s ease,visibility .5s ease}
#startScreen.hidden{opacity:0;visibility:hidden;pointer-events:none}
#startButton{position:relative;z-index:230;width:82px;height:82px;border:none;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff9d8 0%,#ffe38a 18%,#ffc85c 42%,#f5a623 100%);box-shadow:0 0 0 5px rgba(255,255,255,.16),0 12px 28px rgba(245,166,35,.5);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,filter .2s ease;display:flex;align-items:center;justify-content:center;filter:none!important;-webkit-filter:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;animation:startPulse 1.9s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
#startButton::before{content:"";display:block;width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:24px solid #1f180d;transform:translateX(5px)}
#startButton::after{content:"";position:absolute;inset:-10px;border:2px solid rgba(255,255,255,.18);border-radius:50%;opacity:.9}
#startButton:active{transform:scale(.97)}
#startButton:hover{transform:scale(1.03);box-shadow:0 0 0 7px rgba(255,255,255,.14),0 16px 36px rgba(245,166,35,.62)}
@keyframes startPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 5px rgba(255,255,255,.16),0 12px 28px rgba(245,166,35,.5)}50%{transform:scale(1.04);box-shadow:0 0 0 8px rgba(255,255,255,.1),0 16px 36px rgba(245,166,35,.68)}}
@media (max-width: 420px){#startButton{width:74px;height:74px}#startButton::before{border-top-width:12px;border-bottom-width:12px;border-left-width:22px;transform:translateX(4px)}#startButton::after{inset:-8px}} 
</style>
</head>
<body>
<div id="game" class="blurred">
    <img id="background" class="layer" src="assets/bg.png" draggable="false" decoding="async">
    <div id="atmo"></div>
    <div id="girlParallax"><div id="girlWrap"><img id="girl" class="layer" src="assets/girl_1.png" draggable="false" decoding="async"></div></div>
    <div id="vignette"></div>
    <img id="doorTrail" src="assets/door_outline.png" draggable="false" decoding="async">
    <img id="doorOutline" src="assets/door_outline.png" draggable="false" decoding="async">
    <img id="door" src="assets/door.png" draggable="false" decoding="async">
    <div id="burst"></div>
    <img id="tutorialText" class="txt" src="assets/tutorial_text.png" draggable="false" decoding="async">
    <img id="gameText" class="txt" src="assets/text_35.png" draggable="false" decoding="async">
    <img id="hand" src="assets/hand.png" draggable="false" decoding="async">
    <div id="bulbHalo"><i></i><i></i><b></b></div>
    <img id="bulb" src="assets/bulb.png" draggable="false" decoding="async">
    <img id="finalText" class="txt" src="assets/final_text.png" draggable="false" decoding="async">
    <div id="cta"><img src="assets/cta_button.png" draggable="false" decoding="async"></div>
    <canvas id="fx"></canvas>
    <button id="soundButton" type="button" aria-label="Toggle sound">🔊</button>
    <div id="fade"></div>
    <div id="whiteFlash"></div>
</div>
<div id="startScreen">
    <button id="startButton" type="button"></button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const game = $("game"), girl = $("girl"), girlParallax = $("girlParallax"), door = $("door"), doorOutline = $("doorOutline"), doorTrail = $("doorTrail");
const startScreen = $("startScreen"), startButton = $("startButton");
const background = $("background"), tutorialText = $("tutorialText"), gameText = $("gameText"), hand = $("hand");
const bulb = $("bulb"), halo = $("bulbHalo"), finalText = $("finalText"), cta = $("cta"), fade = $("fade");
const whiteFlash = $("whiteFlash"), burstEl = $("burst"), soundButton = $("soundButton"), fx = $("fx"), fctx = fx.getContext("2d");

const CTA_URL = "https://example.com";
const SETTINGS = { releaseBack: 5, voiceDelay: 180, idleHintMs: 2500, thresholds: [20, 40, 80, 100] };
const IMAGES = ["bg","girl_1","girl_2","girl_3","girl_4","girl_final","door","door_outline","bulb","hand","final_bg","tutorial_text","text_35","text_50","text_90","final_text","cta_button"].map(n => `assets/${n}.png`);
const SOUNDS = { music: "assets/music.mp3", door: "assets/door_open.mp3", v35: "assets/text_35.mp3", v50: "assets/text_50.mp3", v90: "assets/text_90.mp3", vfinal: "assets/final_text.mp3" };

let doorProgress = 0, dragging = false, startX = 0, lastX = 0, startProgress = 0, moveSpeed = 0;
let currentScene = 1, finalSceneShown = false, voiceLocked = false, interactionLocked = false;
let audioEnabled = true, timers = [], idleTimer = null, bulbC = { x: 0, y: 0 };

const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const rnd = (a, b) => a + Math.random() * (b - a);
function later(fn, ms) { const id = setTimeout(fn, ms); timers.push(id); return id; }

/* ---------- AUDIO: один AudioContext ---------- */
const Audio_ = (() => {
    let ctx = null, master, musicGain, buffers = {}, musicStarted = false, doorNode = null, voiceNode = null;
    const AC = window.AudioContext || window.webkitAudioContext;
    function ensure() {
        if (ctx || !AC) return ctx;
        ctx = new AC();
        master = ctx.createGain(); master.connect(ctx.destination);
        musicGain = ctx.createGain(); musicGain.gain.value = 0.35; musicGain.connect(master);
        return ctx;
    }
    const decode = (arr) => new Promise((res, rej) => { const p = ctx.decodeAudioData(arr, res, rej); if (p && p.catch) p.catch(rej); });
    async function load() {
        if (!ensure()) return;
        await Promise.all(Object.entries(SOUNDS).map(async ([k, src]) => {
            try { const r = await fetch(src); buffers[k] = await decode(await r.arrayBuffer()); } catch (e) {}
        }));
    }
    function unlock() {
        if (!ensure()) return;
        if (ctx.state !== "running") ctx.resume().catch(() => {});
        try { const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0); } catch (e) {}
    }
    function startMusic() {
        if (musicStarted || !ctx || !buffers.music) return;
        musicStarted = true;
        const s = ctx.createBufferSource(); s.buffer = buffers.music; s.loop = true; s.connect(musicGain); s.start(0);
    }
    function playDoor() {
        stopDoor();
        if (!ctx || !buffers.door) return;
        const g = ctx.createGain(); g.gain.value = 0.7; g.connect(master);
        const s = ctx.createBufferSource(); s.buffer = buffers.door; s.connect(g); s.start(0);
        doorNode = { s, g };
    }
    function stopDoor() {
        if (!doorNode) return;
        const { s, g } = doorNode; doorNode = null;
        try { g.gain.setTargetAtTime(0, ctx.currentTime, 0.03); s.stop(ctx.currentTime + 0.15); } catch (e) {}
    }
    function playVoice(key) {
        stopDoor(); stopVoice();
        const buf = buffers[key];
        if (!ctx || !buf) return 1.8;
        musicGain.gain.setTargetAtTime(0.12, ctx.currentTime, 0.05);
        const s = ctx.createBufferSource(); s.buffer = buf; s.connect(master); s.start(0);
        voiceNode = s;
        return buf.duration;
    }
    function stopVoice() { if (voiceNode) { try { voiceNode.stop(); } catch (e) {} voiceNode = null; } }
    function restoreMusic() { if (ctx) musicGain.gain.setTargetAtTime(0.35, ctx.currentTime, 0.15); }
    function setEnabled(on) { if (ctx) master.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, 0.02); }
    function suspend() { if (ctx && ctx.state === "running") ctx.suspend().catch(() => {}); }
    function resume() { if (ctx && audioEnabled && ctx.state !== "running") ctx.resume().catch(() => {}); }
    function tone(o = {}) {
        if (!ctx || !audioEnabled) return;
        const { frequency = 440, duration = 0.12, volume = 0.04, type = "sine", slide = 0 } = o;
        const t = ctx.currentTime, osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(frequency, t);
        if (slide) osc.frequency.linearRampToValueAtTime(frequency + slide, t + duration);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(volume, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + duration + 0.03);
    }
    return { load, unlock, startMusic, playDoor, stopDoor, playVoice, stopVoice, restoreMusic, setEnabled, suspend, resume, tone };
})();

/* ---------- FX: canvas-частинки ---------- */
let W = 0, H = 0, dpr = 1, parts = [], rings = [], dust = [], lastT = 0, lastTap = -1;
const COLORS = ["255,255,255", "255,210,77", "255,236,160", "255,180,90"];
const pick = () => COLORS[(Math.random() * COLORS.length) | 0];

function resizeFx() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = game.clientWidth; H = game.clientHeight;
    fx.width = W * dpr; fx.height = H * dpr;
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!dust.length) for (let i = 0; i < 16; i++) dust.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(1, 2.2), vx: rnd(-6, 6), vy: rnd(-14, -4), a: rnd(.12, .3) });
}
function emit(x, y, o = {}) {
    if (parts.length > 260) return;
    const life = o.life || .7;
    parts.push({ x, y, vx: o.vx || 0, vy: o.vy || 0, life, max: life, size: o.size || 2.5, c: o.c || "255,255,255", g: o.g || 0, drag: o.drag ?? .96, shape: o.shape || "dot" });
}
function ring(x, y, c, vr, life, w) { rings.push({ x, y, r: 6, vr, life, max: life, c, w }); }
function burst(x, y, n, sp) {
    for (let i = 0; i < n; i++) {
        const a = rnd(0, Math.PI * 2), s = rnd(sp * .35, sp);
        emit(x, y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.5, 1), size: rnd(1.5, 3.2), c: pick(), drag: .93, shape: Math.random() < .3 ? "streak" : "dot" });
    }
}
function localXY(cx, cy) { const r = game.getBoundingClientRect(); return [cx - r.left, cy - r.top]; }

// 4 різні tap-ефекти, підряд не повторюються
function triggerTapEffect(cx, cy) {
    const [x, y] = localXY(cx, cy);
    let t; do { t = (Math.random() * 4) | 0; } while (t === lastTap); lastTap = t;
    if (t === 0) { ring(x, y, "255,255,255", 180, .5, 2); ring(x, y, "255,210,77", 110, .6, 1.5); }
    else if (t === 1) { for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, s = rnd(90, 190); emit(x, y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .6, size: 2.2, c: pick(), drag: .92 }); } }
    else if (t === 2) { for (let i = 0; i < 9; i++) emit(x + rnd(-14, 14), y, { vx: rnd(-30, 30), vy: rnd(-140, -60), life: rnd(.7, 1.1), size: rnd(2, 3.5), c: pick(), drag: .97 }); }
    else { ring(x, y, "255,236,160", 220, .45, 3); for (let i = 0; i < 6; i++) { const a = rnd(0, 6.28), s = rnd(160, 260); emit(x, y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .35, size: 1.6, c: "255,255,255", drag: .9, shape: "streak" }); } }
}
function triggerFlash() {
    const f = document.createElement("div"); f.className = "fx-flash"; game.appendChild(f);
    later(() => f.remove(), 500);
}
function triggerScreenShake() {
    game.classList.remove("shake"); void game.offsetWidth; game.classList.add("shake");
    later(() => game.classList.remove("shake"), 500);
}

function tick(t) {
    requestAnimationFrame(tick);
    const dt = Math.min(.05, (t - lastT) / 1000 || .016); lastT = t;
    if (document.hidden) return;

    // швидкість руху дверей -> glow + trail
    moveSpeed *= Math.pow(.9, dt * 60);
    const g = Math.min(1, moveSpeed / 25);
    doorOutline.style.setProperty("--g", g.toFixed(2));
    doorTrail.style.opacity = (g * .7).toFixed(2);

    if (currentScene === 4 && !finalSceneShown && Math.random() < .12)
        { const a = rnd(0, 6.28), s = rnd(30, 90); emit(bulbC.x, bulbC.y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .8, size: rnd(1.4, 2.6), c: pick(), drag: .96 }); }

    fctx.clearRect(0, 0, W, H);
    fctx.globalCompositeOperation = "lighter";

    for (const d of dust) {
        d.x += d.vx * dt; d.y += d.vy * dt;
        if (d.y < -5) { d.y = H + 5; d.x = rnd(0, W); } if (d.x < -5) d.x = W + 5; if (d.x > W + 5) d.x = -5;
        fctx.fillStyle = `rgba(255,236,190,${d.a})`;
        fctx.beginPath(); fctx.arc(d.x, d.y, d.r, 0, 6.283); fctx.fill();
    }
    for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i]; p.life -= dt;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        const k = Math.pow(p.drag, dt * 60);
        p.vx *= k; p.vy = p.vy * k + p.g * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        const a = p.life / p.max;
        if (p.shape === "streak") {
            fctx.strokeStyle = `rgba(${p.c},${a})`; fctx.lineWidth = p.size;
            fctx.beginPath(); fctx.moveTo(p.x, p.y); fctx.lineTo(p.x - p.vx * .05, p.y - p.vy * .05); fctx.stroke();
        } else {
            fctx.fillStyle = `rgba(${p.c},${a * .25})`; fctx.beginPath(); fctx.arc(p.x, p.y, p.size * 2.6, 0, 6.283); fctx.fill();
            fctx.fillStyle = `rgba(${p.c},${a})`; fctx.beginPath(); fctx.arc(p.x, p.y, p.size * a + .4, 0, 6.283); fctx.fill();
        }
    }
    for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i]; r.life -= dt;
        if (r.life <= 0) { rings.splice(i, 1); continue; }
        r.r += r.vr * dt;
        fctx.strokeStyle = `rgba(${r.c},${r.life / r.max})`; fctx.lineWidth = r.w;
        fctx.beginPath(); fctx.arc(r.x, r.y, r.r, 0, 6.283); fctx.stroke();
    }
}

/* ---------- TEXT ---------- */
function setText(el, on) {
    if (on) {
        el.style.transition = "none"; el.classList.remove("show", "gone"); void el.offsetWidth;
        el.style.transition = ""; el.classList.add("show");
    } else if (el.classList.contains("show")) { el.classList.remove("show"); el.classList.add("gone"); }
}
function showText(src) { gameText.src = src; setText(gameText, true); }

/* ---------- GAME ---------- */
function placeHalo() {
    bulbC = { x: bulb.offsetLeft + bulb.offsetWidth / 2, y: bulb.offsetTop + bulb.offsetHeight / 2 };
    halo.style.left = bulbC.x + "px"; halo.style.top = bulbC.y + "px";
}
function init() {
    timers.forEach(clearTimeout); timers = [];
    doorProgress = 0; currentScene = 1; finalSceneShown = false;
    voiceLocked = false; interactionLocked = false; dragging = false;
    updateDoor();
    door.style.opacity = doorOutline.style.opacity = "1";
    door.style.display = doorOutline.style.display = hand.style.display = "block";
    doorTrail.style.display = "block";
    hand.style.opacity = "1"; hand.style.left = "62%"; hand.style.top = "42%";
    setText(tutorialText, true);
    bulb.classList.remove("visible", "blink", "hit"); halo.classList.remove("on");
    cta.classList.remove("visible");
    background.src = "assets/bg.png";
}

function updateDoor() {
    const t = `translate3d(${(doorProgress / 100) * game.clientWidth}px,0,0)`;
    door.style.transform = doorOutline.style.transform = doorTrail.style.transform = t;
    background.style.transform = `translate3d(${(-doorProgress * .05).toFixed(2)}px,0,0) scale(1.04)`;
    girlParallax.style.transform = `translate3d(${(doorProgress * .03).toFixed(2)}px,0,0)`;
}

function setDoorProgress(v) {
    const cap = SETTINGS.thresholds[currentScene - 1] ?? 100;
    doorProgress = clamp(v, 0, cap);
    updateDoor();
    if (doorProgress >= cap) { if (currentScene === 1) scene35(); else if (currentScene === 2) scene50(); else if (currentScene === 3) scene90(); }
}

function changeGirl(src) {
    girl.style.transition = "opacity .16s,transform .16s,filter .16s";
    girl.style.opacity = ".15"; girl.style.transform = "scale(1.06)"; girl.style.filter = "blur(7px) brightness(1.8)";
    triggerFlash();
    later(() => {
        girl.src = src;
        girl.style.transition = "opacity .38s,transform .5s var(--ease),filter .4s";
        girl.style.opacity = "1"; girl.style.transform = "scale(1)"; girl.style.filter = "none";
    }, 170);
}

function stopDrag() { dragging = false; doorOutline.classList.remove("moving"); Audio_.stopDoor(); }

function playVoice(key) {
    voiceLocked = true; stopDrag(); clearTimeout(idleTimer);
    later(() => {
        const dur = Audio_.playVoice(key);
        later(() => {
            voiceLocked = false; Audio_.restoreMusic();
            setText(gameText, false);
            if (!finalSceneShown) { doorOutline.style.opacity = "1"; hand.style.opacity = "1"; }
            armIdle();
        }, dur * 1000 + 100);
    }, SETTINGS.voiceDelay);
}

function armIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
        if (!dragging && !voiceLocked && !finalSceneShown) { hand.style.opacity = "1"; if (currentScene < 4) doorOutline.style.opacity = "1"; }
    }, SETTINGS.idleHintMs);
}

function scene35() {
    currentScene = 2; changeGirl("assets/girl_2.png"); showText("assets/text_35.png"); playVoice("v35");
    bulb.classList.add("visible"); placeHalo();
    Audio_.tone({ frequency: 520, duration: .16, volume: .03, type: "triangle", slide: 90 });
}
function scene50() {
    currentScene = 3; changeGirl("assets/girl_3.png"); showText("assets/text_50.png"); playVoice("v50");
    triggerScreenShake();
    Audio_.tone({ frequency: 660, duration: .14, volume: .04, type: "sawtooth", slide: 120 });
}
function scene90() {
    currentScene = 4; changeGirl("assets/girl_4.png"); showText("assets/text_90.png");
    door.style.opacity = doorOutline.style.opacity = doorTrail.style.opacity = "0";
    later(() => { door.style.display = doorOutline.style.display = doorTrail.style.display = "none"; }, 450);
    burstEl.classList.remove("go"); void burstEl.offsetWidth; burstEl.classList.add("go");   // light burst
    burst(W * .6, H * .5, 40, 280);
    bulb.classList.add("visible", "blink"); placeHalo(); halo.classList.add("on");
    hand.style.left = "17%"; hand.style.top = "15%";
    playVoice("v90");
    Audio_.tone({ frequency: 780, duration: .18, volume: .05, type: "square", slide: 150 });
}

function releaseDoor() {
    if (!dragging) return;
    stopDrag();
    game.classList.add("settle");
    setDoorProgress(Math.max(0, doorProgress - SETTINGS.releaseBack));
    later(() => game.classList.remove("settle"), 320);
    if (!finalSceneShown && !voiceLocked && currentScene < 4) doorOutline.style.opacity = "1";
    armIdle();
}

// затемнення -> спалах -> персонаж -> текст -> CTA
function showFinalScene() {
    if (finalSceneShown || interactionLocked) return;
    interactionLocked = finalSceneShown = true; currentScene = 5;
    stopDrag(); clearTimeout(idleTimer);
    hand.style.display = "none"; halo.classList.remove("on"); bulb.classList.remove("blink", "visible");
    setText(gameText, false); setText(tutorialText, false);
    fade.classList.add("active");
    Audio_.tone({ frequency: 960, duration: .25, volume: .06, type: "triangle", slide: 200 });
    Audio_.playVoice("vfinal");

    later(() => {
        background.src = "assets/final_bg.png";
        girl.src = "assets/girl_final.png";
        girl.style.transition = "none"; girl.style.opacity = "0"; girl.style.filter = "blur(12px) brightness(2)"; girl.style.transform = "scale(1.1)";
        door.style.display = doorOutline.style.display = doorTrail.style.display = "none";
        whiteFlash.classList.remove("go"); void whiteFlash.offsetWidth; whiteFlash.classList.add("go");
        triggerScreenShake();
        fade.classList.remove("active");
        burst(W / 2, H * .45, 46, 300);
        later(() => {
            girl.style.transition = "opacity .5s,transform .8s var(--ease),filter .7s";
            girl.style.opacity = "1"; girl.style.transform = "scale(1)"; girl.style.filter = "none";
        }, 80);
        later(() => setText(finalText, true), 650);
        later(() => { cta.classList.add("visible"); interactionLocked = false; }, 1250);
    }, 500);
}

function openStore() {
    try { if (window.mraid && typeof mraid.open === "function") { mraid.open(CTA_URL); return; } } catch (e) {}
    window.open(CTA_URL, "_blank");
}

async function startGame() {
    if (startButton.disabled) return;
    startButton.disabled = true;
    game.classList.remove("blurred");
    startScreen.classList.add("hidden");
    Audio_.unlock();
    await Audio_.load();
    Audio_.resume();
    Audio_.startMusic();
    if (!game.classList.contains("ready")) game.classList.add("ready");
    armIdle();
}

/* ---------- INPUT ---------- */
game.addEventListener("pointerdown", (e) => {
    Audio_.unlock(); Audio_.startMusic();
    if (e.target === bulb || e.target === cta || e.target === soundButton || (e.target.closest && e.target.closest("#startButton"))) return;
    if (voiceLocked || interactionLocked || finalSceneShown) return;
    dragging = true; startX = lastX = e.clientX; startProgress = doorProgress;
    clearTimeout(idleTimer);
    setText(tutorialText, false); hand.style.opacity = "0";
    doorOutline.classList.add("moving");            // glow лишається видимим під час руху
    triggerTapEffect(e.clientX, e.clientY);
    Audio_.playDoor();
    try { game.setPointerCapture(e.pointerId); } catch (err) {}
});

game.addEventListener("pointermove", (e) => {
    if (!dragging || voiceLocked || interactionLocked) return;
    const dx = e.clientX - lastX; lastX = e.clientX;
    const delta = e.clientX - startX;
    if (delta <= 0) return;
    const before = doorProgress;
    setDoorProgress(startProgress + (delta / game.clientWidth) * 100);
    // частинки від реального руху дверей
    const moved = (doorProgress - before) / 100 * game.clientWidth;
    if (moved > 0) {
        moveSpeed += moved;
        const [x, y] = localXY(e.clientX, e.clientY);
        const n = Math.min(3, Math.ceil(moved / 8));
        for (let i = 0; i < n; i++) emit(x + rnd(-6, 6), y + rnd(-40, 40), { vx: -Math.max(dx, moved) * rnd(6, 12), vy: rnd(-50, 50), life: rnd(.4, .8), size: rnd(1.5, 3), c: pick(), drag: .92 });
    }
});
game.addEventListener("pointerup", releaseDoor);
game.addEventListener("pointercancel", releaseDoor);

bulb.addEventListener("pointerdown", (e) => {
    e.stopPropagation(); Audio_.unlock();
    if (currentScene < 4 || finalSceneShown || voiceLocked || interactionLocked) return;
    bulb.classList.add("hit");
    burst(bulbC.x, bulbC.y, 28, 230); ring(bulbC.x, bulbC.y, "255,220,120", 240, .5, 3);
    triggerFlash();
    later(() => bulb.classList.remove("hit"), 220);
    showFinalScene();
});

cta.addEventListener("pointerdown", (e) => e.stopPropagation());
cta.addEventListener("click", (e) => {
    e.stopPropagation();
    triggerTapEffect(e.clientX, e.clientY);
    Audio_.tone({ frequency: 880, duration: .12, volume: .04, type: "triangle", slide: 120 });
    openStore();
});

startButton.addEventListener("click", startGame);

soundButton.addEventListener("pointerdown", (e) => { e.stopPropagation(); Audio_.unlock(); });
soundButton.addEventListener("click", (e) => {
    e.stopPropagation();
    audioEnabled = !audioEnabled;
    soundButton.textContent = audioEnabled ? "🔊" : "🔇";
    Audio_.setEnabled(audioEnabled);
    if (audioEnabled) Audio_.resume();
});

game.addEventListener("contextmenu", (e) => e.preventDefault());
const onResize = () => { updateDoor(); resizeFx(); if (bulb.classList.contains("visible") || currentScene >= 2) placeHalo(); };
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", () => setTimeout(onResize, 200));
document.addEventListener("visibilitychange", () => document.hidden ? Audio_.suspend() : Audio_.resume());
window.addEventListener("pagehide", Audio_.suspend);

/* ---------- BOOT ---------- */
function loadImages() {
    return Promise.all(IMAGES.map((src) => new Promise((res) => {
        const img = new Image(); img.src = src;
        (img.decode ? img.decode() : Promise.reject()).then(res, () => { img.onload = img.onerror = res; if (img.complete) res(); });
    })));
}
init(); resizeFx(); requestAnimationFrame(tick);
Promise.race([Promise.all([loadImages(), Audio_.load()]), new Promise((r) => setTimeout(r, 4000))])
    .then(() => { resizeFx(); placeHalo(); game.classList.add("ready"); armIdle(); });
</script>
